<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ルーティン</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family:sans-serif; background:#b2dfdb; text-align:center; padding:20px;}
.card { background:white; border-radius:15px; padding:20px; margin-bottom:20px;}

/* 達成課題ボタン（シンプル） */
button { width:100%; padding:12px; margin:6px 0; border-radius:10px; font-size:16px; border:none; cursor:pointer; background:#e0e0e0; color:#333;}

/* 達成課題ボタン：ゲージ表示 */
.btn-task {
  position: relative;
  overflow: hidden;
}
/* 完了時はボタン全体が緑 */
.btn-on {
  background: #4CAF50 !important;
  color: white !important;
}

/* 操作ボタン（小さく・ピル型・横並び） */
.btn-ctrl {
  width:auto; display:inline-block;
  padding:11px 22px; margin:3px 4px;
  border-radius:20px; font-size:15px;
  border:none; cursor:pointer;
  background:#eeeeee; color:#555;
}
.btn-ctrl-row {
  display:flex; justify-content:center;
  flex-wrap:wrap; margin:8px 0 4px;
}
.btn-danger { background:#ffebee; color:#c62828; }
.btn-info   { background:#e3f2fd; color:#1565c0; }

.btn-spacer { visibility:hidden; pointer-events:none; height:6px; display:block; margin:0; padding:0; }

/* ===== 全完了エフェクト ===== */
#completeOverlay {
  display:none;
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:200; pointer-events:none;
}
#thumbsUp {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%, -50%) scale(0);
  font-size:100px; z-index:201;
  pointer-events:none;
  transition: transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
}
.star {
  position:fixed;
  pointer-events:none;
  font-size:20px;
  animation: starFly 1.2s ease-out forwards;
}
@keyframes starFly {
  0%   { opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
  100% { opacity:0; transform:translate(var(--dx),var(--dy)) scale(0.3) rotate(var(--rot)); }
}

.cal-cell {
  aspect-ratio: 1;
  border-radius: 6px;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: default;
}
.cal-empty  { background: transparent; }
.cal-none   { background: #f0f0f0; color: #bbb; }
.cal-good   { background: #4CAF50; color: white; }
.cal-bad    { background: #e53935; color: white; }
.cal-today  { outline: 2px solid #1565c0; outline-offset: -2px; }

#streak { font-size:24px; font-weight:bold; color:#1565c0;}
</style>
</head>

<body>

<!-- 設定パネル オーバーレイ -->
<div id="settingsPanel" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:100; align-items:flex-start; justify-content:center; overflow-y:auto;">
  <div style="background:white; border-radius:20px; padding:26px 22px; width:88%; max-width:380px; position:relative; margin:30px auto 40px;">

    <!-- ✕ 閉じるボタン（右上） -->
    <button onclick="closeSettings()" style="position:absolute; top:12px; right:12px; width:36px; height:36px; padding:0; font-size:20px; background:#f0f0f0; color:#555; border-radius:50%; margin:0; line-height:1;">✕</button>

    <h3 style="margin:0 0 16px; font-size:18px; text-align:left;">達成課題の名前変更</h3>

    <!-- 達成課題リスト（動的） -->
    <div id="labelRows"></div>

    <!-- 区切り線 -->
    <hr style="border:none; border-top:1px solid #e8e8e8; margin:16px 0;">

    <h3 style="margin:0 0 14px; font-size:18px; text-align:left;">今日の時間帯設定</h3>

    <!-- 今日の開始時刻 -->
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <div style="flex:1; text-align:left;">
        <div style="font-size:13px; color:#888; margin-bottom:4px;">今日の開始時刻</div>
        <div style="font-size:12px; color:#bbb; margin-bottom:6px;">グラフ・判定の基準開始</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span style="font-size:14px; color:#555;">現在：<b id="dayStartDisplay"></b></span>
        </div>
        <div style="display:flex; gap:8px; align-items:center; margin-top:6px;">
          <input id="dayStartInput" type="time" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
          <button onclick="applyDayStart()" style="width:auto; padding:10px 14px; font-size:15px; background:#4CAF50; color:white; border-radius:8px; margin:0; flex-shrink:0;">変更</button>
        </div>
      </div>
    </div>

    <!-- リセット時刻 -->
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <div style="flex:1; text-align:left;">
        <div style="font-size:13px; color:#888; margin-bottom:4px;">リセット時刻（翌日）</div>
        <div style="font-size:12px; color:#bbb; margin-bottom:6px;">この時刻にチェックが自動リセット</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span style="font-size:14px; color:#555;">現在：<b id="dayResetDisplay"></b></span>
        </div>
        <div style="display:flex; gap:8px; align-items:center; margin-top:6px;">
          <input id="dayResetInput" type="time" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
          <button onclick="applyDayReset()" style="width:auto; padding:10px 14px; font-size:15px; background:#4CAF50; color:white; border-radius:8px; margin:0; flex-shrink:0;">変更</button>
        </div>
      </div>
    </div>

    <!-- 完了期限時刻 -->
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:22px;">
      <div style="flex:1; text-align:left;">
        <div style="font-size:13px; color:#888; margin-bottom:4px;">完了期限時刻</div>
        <div style="font-size:12px; color:#bbb; margin-bottom:6px;">この時刻までに完了で成功（緑）</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span style="font-size:14px; color:#555;">現在：<b id="deadlineDisplay"></b></span>
        </div>
        <div style="display:flex; gap:8px; align-items:center; margin-top:6px;">
          <input id="deadlineInput" type="time" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
          <button onclick="applyDeadline()" style="width:auto; padding:10px 14px; font-size:15px; background:#4CAF50; color:white; border-radius:8px; margin:0; flex-shrink:0;">変更</button>
        </div>
      </div>
    </div>

    <!-- 区切り線 -->
    <hr style="border:none; border-top:1px solid #e8e8e8; margin:0 0 16px;">

    <h3 style="margin:0 0 10px; font-size:18px; text-align:left;">過去データの手入力</h3>
    <p style="font-size:14px; color:#aaa; margin:0 0 12px; text-align:left;">同じ日付は上書きされます。</p>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <div style="display:flex; flex-direction:column; gap:4px; flex:1;">
        <label style="font-size:13px; color:#888;">日付</label>
        <input id="manualDate" type="date" style="width:100%; padding:9px; border:1px solid #ccc; border-radius:8px; font-size:15px; box-sizing:border-box;">
      </div>
      <div style="display:flex; flex-direction:column; gap:4px; flex:1;">
        <label style="font-size:13px; color:#888;">完了時刻</label>
        <input id="manualTime" type="time" style="width:100%; padding:9px; border:1px solid #ccc; border-radius:8px; font-size:15px; box-sizing:border-box;">
      </div>
    </div>
    <div id="manualMsg" style="font-size:14px; min-height:18px; text-align:left; margin-bottom:8px;"></div>
    <button onclick="addManualLog()" style="background:#1565c0; color:white; font-size:16px; margin:0 0 14px; padding:12px;">追加する</button>
    <div id="manualLogList" style="text-align:left; font-size:14px; color:#555; max-height:140px; overflow-y:auto;"></div>

    <!-- 区切り線 -->
    <hr style="border:none; border-top:1px solid #e8e8e8; margin:16px 0;">

    <h3 style="margin:0 0 10px; font-size:18px; text-align:left;">バックアップ／復元</h3>
    <p style="font-size:14px; color:#aaa; margin:0 0 12px; text-align:left;">全ルーティン記録をJSONファイルで保存・復元できます。</p>

    <button onclick="exportBackup()" style="background:#1565c0; color:white; font-size:16px; margin:0 0 10px; padding:12px;">
      📥 バックアップをダウンロード
    </button>

    <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
      <label for="importFile" style="display:block; flex:1; padding:12px; font-size:16px; background:#e8f5e9; color:#2e7d32; border-radius:10px; text-align:center; cursor:pointer; margin:0;">
        📤 ファイルから復元
      </label>
      <input id="importFile" type="file" accept=".json" onchange="importBackup(event)" style="display:none;">
    </div>
    <div id="backupMsg" style="font-size:14px; min-height:18px; text-align:left; margin-bottom:4px;"></div>

    <p style="font-size:13px; color:#bbb; margin:6px 0 0; text-align:left;">※ 自動バックアップ：全課題完了時に毎日1回自動保存されます。</p>
    <div id="autoBackupInfo" style="font-size:13px; color:#888; margin-top:4px; text-align:left;"></div>

  </div>
</div>

<div id="completeOverlay"></div>
<div id="thumbsUp">👍</div>

<div class="card" style="position:relative; padding-top:52px;">
  <!-- 設定ボタン（右上）歯車＋テキスト -->
  <button onclick="openSettings()" style="position:absolute; top:14px; right:12px; display:flex; align-items:center; gap:6px; width:auto; padding:6px 12px; background:#f0f0f0; color:#444; border-radius:20px; margin:0; cursor:pointer; border:none;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48" width="28" height="28" style="display:block; flex-shrink:0;"><path d="M -4.09,-12.34 L -3.15,-17.72 L 3.15,-17.72 L 4.09,-12.34 L 5.83,-11.62 L 10.30,-14.76 L 14.76,-10.30 L 11.62,-5.83 L 12.34,-4.09 L 17.72,-3.15 L 17.72,3.15 L 12.34,4.09 L 11.62,5.83 L 14.76,10.30 L 10.30,14.76 L 5.83,11.62 L 4.09,12.34 L 3.15,17.72 L -3.15,17.72 L -4.09,12.34 L -5.83,11.62 L -10.30,14.76 L -14.76,10.30 L -11.62,5.83 L -12.34,4.09 L -17.72,3.15 L -17.72,-3.15 L -12.34,-4.09 L -11.62,-5.83 L -14.76,-10.30 L -10.30,-14.76 L -5.83,-11.62 Z" fill="#888" stroke="#666" stroke-width="0.8" stroke-linejoin="round"/><circle cx="0" cy="0" r="6" fill="white" stroke="#666" stroke-width="0.8"/></svg>
    <span style="font-size:14px; font-weight:bold;">設定</span>
  </button>

  <h2 id="statusMsg">ルーティン</h2>

  <div id="streak">📈 成功日 0日</div>

  <!-- タスクボタン（動的生成） -->
  <div id="taskButtons"></div>

  <!-- 空白スペース -->
  <div class="btn-spacer"></div>

  <!-- 操作ボタン群 -->
  <div class="btn-ctrl-row">
    <button class="btn-ctrl btn-danger" onclick="showResetConfirm()">今日リセット</button>
    <button class="btn-ctrl btn-info" onclick="showAnalysis()">AI分析</button>
  </div>

  <!-- リセット確認UI -->
  <div id="resetConfirm" style="display:none; background:#fff3cd; border-radius:10px; padding:10px; margin:6px 0;">
    <p style="margin:0 0 8px; font-size:14px;">今日の記録を消去しますか？</p>
    <button class="btn-ctrl btn-danger" onclick="doReset()" style="width:auto; margin:3px;">消去する</button>
    <button class="btn-ctrl" onclick="hideResetConfirm()" style="width:auto; margin:3px;">キャンセル</button>
  </div>

  <button onclick="showAnalysis()" style="display:none;"></button>
</div>

<div class="card">
  <h3>完了時刻</h3>
  <canvas id="lineChart"></canvas>
</div>

<div class="card">
  <h3 style="margin-bottom:10px;">カレンダー</h3>
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
    <button onclick="calPrev()" style="width:36px; height:36px; padding:0; font-size:18px; margin:0; border-radius:8px;">‹</button>
    <span id="calTitle" style="font-size:15px; font-weight:bold;"></span>
    <button onclick="calNext()" style="width:36px; height:36px; padding:0; font-size:18px; margin:0; border-radius:8px;">›</button>
  </div>
  <!-- 曜日ヘッダー -->
  <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px;">
    <div style="font-size:11px; color:#e53935; font-weight:bold;">日</div>
    <div style="font-size:11px; color:#555;">月</div>
    <div style="font-size:11px; color:#555;">火</div>
    <div style="font-size:11px; color:#555;">水</div>
    <div style="font-size:11px; color:#555;">木</div>
    <div style="font-size:11px; color:#555;">金</div>
    <div style="font-size:11px; color:#1565c0; font-weight:bold;">土</div>
  </div>
  <div id="calGrid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px;"></div>
  <!-- 凡例 -->
  <div style="display:flex; justify-content:center; gap:14px; margin-top:10px; font-size:12px; color:#555;">
    <span><span style="display:inline-block; width:12px; height:12px; background:#4CAF50; border-radius:3px; vertical-align:middle; margin-right:4px;"></span>成功</span>
    <span><span style="display:inline-block; width:12px; height:12px; background:#e53935; border-radius:3px; vertical-align:middle; margin-right:4px;"></span>超過</span>
    <span><span style="display:inline-block; width:12px; height:12px; background:#f0f0f0; border-radius:3px; vertical-align:middle; margin-right:4px;"></span>記録なし</span>
  </div>
</div>

<script>
let DEADLINE  = localStorage.getItem('deadline')  || "23:30";
let DAY_START = localStorage.getItem('dayStart')  || "18:00"; // 今日の開始時刻
let DAY_RESET = localStorage.getItem('dayReset')  || "06:00"; // リセット時刻（翌朝）

let status    = JSON.parse(localStorage.getItem('status')) || {};
let logs      = JSON.parse(localStorage.getItem('logs'))   || [];
let undoStack = JSON.parse(sessionStorage.getItem('undoStack')) || [];

// ===== タスク管理（動的配列） =====
const DEFAULT_TASKS = [
  {key:'bath',  label:'風呂'},
  {key:'meds',  label:'服薬'},
  {key:'phone', label:'スマホ終了'}
];
let tasks = JSON.parse(localStorage.getItem('tasks')) || DEFAULT_TASKS.map(t=>({...t}));

// 後方互換：旧labelsデータをtasksに移行
(function migrateLabels(){
  const old = localStorage.getItem('labels');
  if (old && !localStorage.getItem('tasks')) {
    const o = JSON.parse(old);
    tasks = DEFAULT_TASKS.map(t => ({key:t.key, label: o[t.key] || t.label}));
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }
})();

// statusのキーをtasksに同期（不足分を補完）
if (!status || typeof status !== 'object') status = {};
tasks.forEach(t => { if (!(t.key in status)) status[t.key] = false; });

function saveTasks() { localStorage.setItem('tasks', JSON.stringify(tasks)); }

// ===== 今月のタスク別達成率を計算 =====
function calcMonthlyRate(key) {
  const now   = new Date();
  const year  = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const prefix = `${year}-${month}`;
  // 今月の成功ログ数 / 今月の経過日数
  const monthLogs = logs.filter(l => l.date.startsWith(prefix));
  const successCount = monthLogs.filter(l => l.success).length;
  const daysPassed = Math.max(1, now.getDate());
  return Math.round((successCount / daysPassed) * 100);
}

function renderLabels() {
  const container = document.getElementById('taskButtons');
  container.innerHTML = '';
  tasks.forEach(t => {
    const btn = document.createElement('button');
    btn.id = t.key + 'Btn';
    const rate = calcMonthlyRate(t.key);
    if (status[t.key]) {
      btn.className = 'btn-task btn-on';
      btn.style.background = '#4CAF50';
      btn.style.color = 'white';
    } else {
      btn.className = 'btn-task';
      btn.style.background = `linear-gradient(to right, #a5d6a7 ${rate}%, #e0e0e0 ${rate}%)`;
      btn.style.color = '#333';
    }
    btn.style.position = 'relative';
    btn.innerHTML = `<span>${t.label}</span><span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:#555;">${rate}%</span>`;
    btn.onclick = () => toggleTask(t.key);
    container.appendChild(btn);
  });
}

function renderButtons() {
  tasks.forEach(t => {
    const btn = document.getElementById(t.key + 'Btn');
    if (!btn) return;
    const rate = calcMonthlyRate(t.key);
    if (status[t.key]) {
      btn.className = 'btn-task btn-on';
      btn.style.background = '#4CAF50';
      btn.style.color = 'white';
    } else {
      btn.className = 'btn-task';
      btn.style.background = `linear-gradient(to right, #a5d6a7 ${rate}%, #e0e0e0 ${rate}%)`;
      btn.style.color = '#333';
    }
    const rateEl = btn.querySelector('span:last-child');
    if (rateEl) rateEl.innerText = rate + '%';
  });
}

// ===== 設定パネル内のラベル行を描画 =====
function renderLabelRows() {
  const rows = document.getElementById('labelRows');
  rows.innerHTML = '';

  tasks.forEach((t, i) => {
    const isFixed = i < 3;
    const row = document.createElement('div');
    row.style.cssText = 'margin-bottom:14px;';

    // textarea
    const label = document.createElement('div');
    label.style.cssText = 'font-size:17px; font-weight:bold; color:#333; margin-bottom:6px; text-align:left;';
    label.innerText = `達成課題${i+1}`;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex; gap:6px; align-items:center;';

    const ta = document.createElement('textarea');
    ta.id = 'labelInput_' + t.key;
    ta.value = t.label;
    ta.placeholder = '課題名を入力';
    ta.style.cssText = 'width:66%; flex:none; padding:8px; border:1px solid #ddd; border-radius:8px; font-size:15px; resize:none; height:46px; line-height:1.4; box-sizing:border-box;';

    const btnChange = document.createElement('button');
    btnChange.innerText = '変更';
    btnChange.style.cssText = 'width:48px; height:46px; padding:0; font-size:13px; background:#4CAF50; color:white; border-radius:8px; margin:0; flex-shrink:0;';
    btnChange.addEventListener('click', () => applyLabel(t.key));

    wrap.appendChild(ta);
    wrap.appendChild(btnChange);

    if (!isFixed) {
      const btnDel = document.createElement('button');
      btnDel.innerText = '－';
      btnDel.style.cssText = 'width:38px; height:46px; padding:0; font-size:20px; background:#fce4ec; color:#e53935; border-radius:8px; margin:0; flex-shrink:0;';
      btnDel.addEventListener('click', () => deleteTask(t.key));
      wrap.appendChild(btnDel);
    }

    row.appendChild(label);
    row.appendChild(wrap);
    rows.appendChild(row);
  });

  // ＋追加行
  const addRow = document.createElement('div');
  addRow.style.cssText = 'margin-bottom:4px;';

  const addLabel = document.createElement('div');
  addLabel.style.cssText = 'font-size:17px; font-weight:bold; color:#333; margin-bottom:6px; text-align:left;';
  addLabel.innerText = `達成課題${tasks.length + 1}を追加`;

  const addWrap = document.createElement('div');
  addWrap.style.cssText = 'display:flex; gap:6px; align-items:center;';

  const addTa = document.createElement('textarea');
  addTa.id = 'newTaskInput';
  addTa.placeholder = '新しい課題名';
  addTa.style.cssText = 'width:66%; flex:none; padding:8px; border:1px solid #ddd; border-radius:8px; font-size:15px; resize:none; height:46px; line-height:1.4; box-sizing:border-box;';

  const btnAdd = document.createElement('button');
  btnAdd.innerText = '＋';
  btnAdd.style.cssText = 'width:38px; height:46px; padding:0; font-size:22px; background:#e8f5e9; color:#4CAF50; border-radius:8px; margin:0; flex-shrink:0;';
  btnAdd.addEventListener('click', addTask);

  addWrap.appendChild(addTa);
  addWrap.appendChild(btnAdd);
  addRow.appendChild(addLabel);
  addRow.appendChild(addWrap);
  rows.appendChild(addRow);
}

function applyLabel(key) {
  const el = document.getElementById('labelInput_' + key);
  if (!el) return;
  const val = el.value.trim();
  if (!val) return;
  const t = tasks.find(t => t.key === key);
  if (!t) return;
  t.label = val;
  saveTasks();
  renderLabels();
  renderButtons();
}

function addTask() {
  const inp = document.getElementById('newTaskInput');
  const val = inp.value.trim();
  if (!val) return;
  const key = 'task_' + Date.now();
  tasks.push({key, label: val});
  status[key] = false;
  saveTasks();
  save();
  renderLabels();
  renderButtons();
  renderLabelRows();
}

function deleteTask(key) {
  const idx = tasks.findIndex(t => t.key === key);
  if (idx === -1 || idx < 3) return;
  tasks.splice(idx, 1);
  delete status[key];
  saveTasks();
  save();
  renderLabels();
  renderButtons();
  renderLabelRows();
}

function applyDeadline() {
  const val = document.getElementById('deadlineInput').value;
  if (!val) return;
  DEADLINE = val;
  localStorage.setItem('deadline', DEADLINE);
  document.getElementById('deadlineDisplay').innerText = DEADLINE;
  logs = logs.map(l => ({ ...l, success: isSuccess(l.finish) }));
  save();
  renderStreak();
  refreshCharts();
}

function applyDayStart() {
  const val = document.getElementById('dayStartInput').value;
  if (!val) return;
  DAY_START = val;
  localStorage.setItem('dayStart', DAY_START);
  document.getElementById('dayStartDisplay').innerText = DAY_START;
  logs = logs.map(l => ({ ...l, success: isSuccess(l.finish) }));
  save();
  renderStreak();
  refreshCharts();
}

function applyDayReset() {
  const val = document.getElementById('dayResetInput').value;
  if (!val) return;
  DAY_RESET = val;
  localStorage.setItem('dayReset', DAY_RESET);
  document.getElementById('dayResetDisplay').innerText = DAY_RESET;
  refreshCharts();
}

function openSettings() {
  renderLabelRows();
  document.getElementById('dayStartDisplay').innerText  = DAY_START;
  document.getElementById('dayStartInput').value        = DAY_START;
  document.getElementById('dayResetDisplay').innerText  = DAY_RESET;
  document.getElementById('dayResetInput').value        = DAY_RESET;
  document.getElementById('deadlineDisplay').innerText  = DEADLINE;
  document.getElementById('deadlineInput').value        = DEADLINE;
  document.getElementById('manualDate').value  = getTodayJST();
  document.getElementById('manualTime').value  = '';
  document.getElementById('manualMsg').innerText = '';
  renderManualLogList();
  renderAutoBackupInfo();
  const p = document.getElementById('settingsPanel');
  p.style.display = 'flex';
}

function closeSettings() {
  document.getElementById('settingsPanel').style.display = 'none';
}

// ===== 過去データ手入力 =====
function addManualLog() {
  const dateVal = document.getElementById('manualDate').value; // "2025-04-29"
  const timeVal = document.getElementById('manualTime').value; // "23:15"
  const msgEl   = document.getElementById('manualMsg');

  if (!dateVal) { msgEl.innerText = '日付を入力してください'; return; }
  if (!timeVal) { msgEl.innerText = '就寝時刻を入力してください'; return; }

  const entry = { date: dateVal, finish: timeVal, success: isSuccess(timeVal) };
  const idx = logs.findIndex(l => l.date === dateVal);
  if (idx >= 0) {
    logs[idx] = entry;
    msgEl.style.color = '#1565c0';
    msgEl.innerText = `${dateVal} のデータを上書きしました`;
  } else {
    logs.push(entry);
    // 日付順にソート
    logs.sort((a, b) => a.date.localeCompare(b.date));
    msgEl.style.color = '#4CAF50';
    msgEl.innerText = `${dateVal} のデータを追加しました`;
  }

  save();
  renderManualLogList();
  renderStreak();
  refreshCharts();
}

function renderManualLogList() {
  const el = document.getElementById('manualLogList');
  if (!el) return;
  if (logs.length === 0) { el.innerHTML = '<span style="color:#aaa;">データなし</span>'; return; }

  const recent = logs.slice().reverse().slice(0, 10); // 直近10件
  el.innerHTML = '<div style="font-size:12px; color:#999; margin-bottom:4px;">直近の記録（最大10件）</div>' +
    recent.map(l =>
      `<div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #f0f0f0;">
        <span>${l.date}</span>
        <span>${l.finish}</span>
        <span style="color:${l.success ? '#4CAF50' : '#e53935'}">${l.success ? '✓ 成功' : '✗ 超過'}</span>
        <button onclick="deleteManualLog('${l.date}')" style="width:auto; padding:2px 8px; font-size:11px; background:#f5f5f5; color:#e53935; margin:0; border-radius:4px;">削除</button>
      </div>`
    ).join('');
}

function deleteManualLog(date) {
  logs = logs.filter(l => l.date !== date);
  save();
  renderManualLogList();
  renderStreak();
  refreshCharts();
  document.getElementById('manualMsg').style.color = '#888';
  document.getElementById('manualMsg').innerText = `${date} のデータを削除しました`;
}

// ===== バックアップ・復元 =====
function exportBackup() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    logs:   logs,
    tasks:  tasks,
    deadline: DEADLINE
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `routine_backup_${getTodayJST()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.logs || !Array.isArray(data.logs)) throw new Error('不正なファイル形式');

      logs  = data.logs;
      if (data.tasks)    { tasks = data.tasks; saveTasks(); }
      if (data.deadline) { DEADLINE = data.deadline; localStorage.setItem('deadline', DEADLINE); }
      save();
      renderLabels();
      renderButtons();
      renderStreak();
      refreshCharts();

      const msg = document.getElementById('backupMsg');
      msg.style.color = '#4CAF50';
      msg.innerText = `✓ 復元完了：${logs.length}件のログを読み込みました`;

      // ファイル入力をリセット
      event.target.value = '';
    } catch(err) {
      const msg = document.getElementById('backupMsg');
      msg.style.color = '#e53935';
      msg.innerText = '復元失敗：正しいバックアップファイルを選んでください';
    }
  };
  reader.readAsText(file);
}

// ===== 自動バックアップ（全課題完了時に1日1回） =====
function autoBackupIfNeeded() {
  const today     = getTodayJST();
  const lastBackup = localStorage.getItem('lastAutoBackup') || '';
  if (lastBackup === today) return; // 今日すでに実行済み

  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    logs:   logs,
    tasks:  tasks,
    deadline: DEADLINE
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `routine_auto_${today}.json`;
  a.click();
  URL.revokeObjectURL(url);

  localStorage.setItem('lastAutoBackup', today);

  // 設定パネルが開いていれば表示更新
  const info = document.getElementById('autoBackupInfo');
  if (info) info.innerText = `最終自動バックアップ：${today}`;
}

function renderAutoBackupInfo() {
  const info = document.getElementById('autoBackupInfo');
  if (!info) return;
  const last = localStorage.getItem('lastAutoBackup') || 'なし';
  info.innerText = `最終自動バックアップ：${last}`;
}
function getTodayJST() {
  const now = new Date();
  const jst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  return jst.toISOString().slice(0, 10);
}
function save() {
  localStorage.setItem('status', JSON.stringify(status));
  localStorage.setItem('logs',   JSON.stringify(logs));
  sessionStorage.setItem('undoStack', JSON.stringify(undoStack));
}

// ===== 時刻を「今日の開始時刻」基準の分数に変換 =====
function timeToMinutesFromStart(time) {
  const [th, tm] = time.split(':').map(Number);
  const [sh, sm] = DAY_START.split(':').map(Number);
  let t = th * 60 + tm;
  const s = sh * 60 + sm;
  // 開始時刻より前（翌日扱い）なら+1440
  if (t < s) t += 1440;
  return t;
}

function isSuccess(time) {
  const t = timeToMinutesFromStart(time);
  const [dh, dm] = DEADLINE.split(':').map(Number);
  let d = dh * 60 + dm;
  const [sh, sm] = DAY_START.split(':').map(Number);
  const s = sh * 60 + sm;
  if (d < s) d += 1440;
  return t <= d;
}

// ===== 成功日数計算（成功した日のみカウント・失敗日は含まない） =====
function calcStreak() {
  return logs.filter(l => l.success).length;
}

// ===== 表示 =====
function renderStreak() {
  const s = calcStreak();
  const el = document.getElementById("streak");
  el.innerText = `📈 成功日 ${s}日`;
  el.style.color = s >= 3 ? "#4CAF50" : "#1565c0";
}

function renderButtons() {
  tasks.forEach(t => {
    const btn = document.getElementById(t.key + 'Btn');
    if (btn) btn.className = status[t.key] ? 'btn-on' : '';
  });
}

// ===== 操作（タップで完了、再タップで取り消し） =====
function toggleTask(type) {
  // スナップショット保存
  undoStack.push({ status: JSON.stringify(status), logs: JSON.stringify(logs) });

  if (status[type]) {
    // 完了→未完了に戻す
    status[type] = false;
    // 全完了ログも取り消す
    const today = getTodayJST();
    logs = logs.filter(l => l.date !== today);
    save();
    renderButtons();
    renderStreak();
    refreshCharts();
    document.getElementById("statusMsg").innerText = "未完了：今すぐ行動";
    document.body.style.background = "#b2dfdb";
  } else {
    // 未完了→完了
    status[type] = true;
    save();
    renderButtons();

    // 全タスク完了したらログ記録
    if (tasks.every(t => status[t.key])) {
      const now   = new Date();
      const time  = now.toTimeString().slice(0, 5);
      const today = getTodayJST();
      const idx   = logs.findIndex(l => l.date === today);
      const entry = { date: today, finish: time, success: isSuccess(time) };
      if (idx >= 0) logs[idx] = entry;
      else logs.push(entry);
      save();
      document.getElementById("statusMsg").innerText = "完了";
      renderStreak();
      refreshCharts();
      autoBackupIfNeeded();
      showCompleteEffect();
    }
  }
}

// ===== Undo（1項目だけ戻す） =====
function undoLast() {
  if (undoStack.length === 0) return;

  const snap = undoStack.pop();
  const prevStatus = JSON.parse(snap.status);
  const prevLogs   = JSON.parse(snap.logs);

  // どのキーが変わったか特定して1つだけ戻す
  const keys = tasks.map(t => t.key);
  let undoneKey = null;
  for (const k of keys) {
    if (prevStatus[k] !== status[k]) {
      status[k] = prevStatus[k];
      undoneKey = k;
      break; // 1項目だけ
    }
  }

  // ログも前の状態に戻す（完了が取り消された場合）
  logs = prevLogs;

  save();
  renderButtons();
  renderStreak();
  refreshCharts();

  if (undoneKey) {
    document.getElementById("statusMsg").innerText = `「${labelOf(undoneKey)}」を元に戻しました`;
  }
  if (!(status.bath && status.meds && status.phone)) {
    document.getElementById("statusMsg").innerText =
      (document.getElementById("statusMsg").innerText === "完了") ? "未完了：今すぐ行動" :
      document.getElementById("statusMsg").innerText;
  }
}

function labelOf(key) {
  const t = tasks.find(t => t.key === key);
  return t ? t.label : key;
}

// ===== 今日リセット =====
function showResetConfirm() {
  document.getElementById("resetConfirm").style.display = "block";
}

function hideResetConfirm() {
  document.getElementById("resetConfirm").style.display = "none";
}

function doReset() {
  hideResetConfirm();

  // 今日のログを削除（手動リセット時）
  const today = getTodayJST();
  logs = logs.filter(l => l.date !== today);

  const resetStatus = {};
  tasks.forEach(t => { resetStatus[t.key] = false; });
  status = resetStatus;
  undoStack = [];

  save();
  renderButtons();
  renderStreak();
  refreshCharts();

  document.getElementById("statusMsg").innerText = "未完了：今すぐ行動";
  document.body.style.background = "#b2dfdb";
}

// ===== グラフ =====
let lineChartInstance = null;

function renderLine() {
  const last = logs.slice(-7);
  const ctx  = document.getElementById('lineChart');

  if (lineChartInstance) {
    lineChartInstance.destroy();
    lineChartInstance = null;
  }
  if (last.length === 0) return;

  // 時刻を数値に変換（DAY_START基準で開始時刻より前は+24）
  const [sh] = DAY_START.split(':').map(Number);
  const [rh] = DAY_RESET.split(':').map(Number);
  // Y軸: DAY_START 〜 DAY_RESET（翌日）
  const yMin = sh;
  const yMax = rh < sh ? rh + 24 : rh;

  const data = last.map(l => {
    const [h, m] = l.finish.split(":").map(Number);
    const val = h + m / 60;
    return val < sh ? val + 24 : val;
  });
  const chartLabels = last.map(l => l.date.slice(5));

  lineChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: chartLabels,
      datasets: [{
        label: '完了時刻',
        data,
        borderColor: '#4CAF50',
        backgroundColor: 'rgba(76,175,80,0.1)',
        tension: 0.3,
        fill: false,
        pointRadius: 5,
        pointBackgroundColor: data.map(v => isSuccess(
          (() => { const h = v >= 24 ? v-24 : v; return `${Math.floor(h)}:${String(Math.round((h%1)*60)).padStart(2,'0')}`; })()
        ) ? '#4CAF50' : '#e53935')
      }]
    },
    options: {
      scales: {
        y: {
          min: yMin,
          max: yMax,
          reverse: false,
          ticks: {
            stepSize: 1,
            callback: v => {
              const h = v >= 24 ? v - 24 : v;
              return `${Math.floor(h)}:00`;
            }
          },
          grid: { color: 'rgba(0,0,0,0.05)' }
        }
      },
      plugins: {
        legend: { labels: { usePointStyle:true, pointStyle:'circle' } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              const h = v >= 24 ? v - 24 : v;
              const hh = Math.floor(h);
              const mm = String(Math.round((h%1)*60)).padStart(2,'0');
              return `完了時刻: ${v >= 24 ? '翌' : ''}${hh}:${mm}`;
            }
          }
        }
      }
    }
  });
}

// ===== カレンダー =====
let calYear  = 0;
let calMonth = 0; // 0-11

function initCalendar() {
  const now = new Date();
  calYear  = now.getFullYear();
  calMonth = now.getMonth();
}

function calPrev() {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderHeatmap();
}

function calNext() {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderHeatmap();
}

function renderHeatmap() {
  if (calYear === 0) initCalendar();

  const today = getTodayJST();
  const grid  = document.getElementById('calGrid');
  grid.innerHTML = '';

  // タイトル更新
  document.getElementById('calTitle').innerText =
    `${calYear}年${calMonth + 1}月`;

  // ログをdateキーでマップ化
  const logMap = {};
  logs.forEach(l => { logMap[l.date] = l; });

  // 月初の曜日（0=日〜6=土）
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  // 月末日
  const lastDate = new Date(calYear, calMonth + 1, 0).getDate();

  // 空白セル
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell cal-empty';
    grid.appendChild(el);
  }

  // 日付セル
  for (let d = 1; d <= lastDate; d++) {
    const mm   = String(calMonth + 1).padStart(2, '0');
    const dd   = String(d).padStart(2, '0');
    const dateStr = `${calYear}-${mm}-${dd}`;
    const log  = logMap[dateStr];

    let cls = 'cal-none';
    if (log) cls = log.success ? 'cal-good' : 'cal-bad';

    const el = document.createElement('div');
    el.className = `cal-cell ${cls}${dateStr === today ? ' cal-today' : ''}`;
    el.innerText = d;

    // ツールチップ（記録あり日のみ）
    if (log) el.title = `${dateStr}  就寝 ${log.finish}`;

    grid.appendChild(el);
  }
}

function refreshCharts() {
  renderLine();
  renderHeatmap();
}

// ===== 全完了エフェクト =====
function showCompleteEffect() {
  const overlay = document.getElementById('completeOverlay');
  const thumb   = document.getElementById('thumbsUp');
  const emojis  = ['⭐','🌟','✨','💫','🎉','⚡','🌠'];
  const count   = 40;

  // 星を生成
  overlay.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.innerText = emojis[Math.floor(Math.random() * emojis.length)];

    // 画面中央から放射状に飛ぶ
    const angle  = Math.random() * 360;
    const dist   = 150 + Math.random() * 300;
    const dx     = Math.cos(angle * Math.PI / 180) * dist;
    const dy     = Math.sin(angle * Math.PI / 180) * dist;
    const rot    = (Math.random() - 0.5) * 720 + 'deg';
    const delay  = Math.random() * 0.4;
    const size   = 16 + Math.random() * 24;

    star.style.cssText = `
      left:50%; top:50%;
      font-size:${size}px;
      --dx:${dx}px; --dy:${dy}px; --rot:${rot};
      animation-delay:${delay}s;
    `;
    overlay.appendChild(star);
  }

  // 👍 を中央にポップ表示
  overlay.style.display = 'block';
  thumb.style.display = 'block';
  setTimeout(() => { thumb.style.transform = 'translate(-50%,-50%) scale(1)'; }, 50);

  // 1.8秒後にフェードアウト
  setTimeout(() => {
    thumb.style.transition = 'transform 0.3s ease-in, opacity 0.3s ease-in';
    thumb.style.opacity = '0';
    thumb.style.transform = 'translate(-50%,-50%) scale(0.5)';
    setTimeout(() => {
      overlay.style.display = 'none';
      overlay.innerHTML = '';
      thumb.style.display = 'none';
      thumb.style.transform = 'translate(-50%,-50%) scale(0)';
      thumb.style.opacity = '1';
    }, 350);
  }, 1800);
}

// ===== AI分析 =====
function analyzeAI() {
  if (logs.length < 3) return "データ不足（3日以上記録してください）";
  const rate = ((logs.filter(l => l.success).length / logs.length) * 100).toFixed(0);
  let msg = `成功率 ${rate}%\n`;
  if (rate < 50)      msg += "生活崩壊レベル";
  else if (rate < 80) msg += "スマホ制限が鍵";
  else                msg += "習慣化成功！";
  return msg;
}

function showAnalysis() { alert(analyzeAI()); }

// ===== 起動時リセット（再起動・更新時に常にstatusをリセット） =====
function checkAndResetOnLaunch() {
  const resetStatus = {};
  tasks.forEach(t => { resetStatus[t.key] = false; });
  status = resetStatus;
  undoStack = [];

  // 全ログのsuccess値を現在のDEADLINEで再計算（古いデータの誤判定を修正）
  logs = logs.map(l => ({ ...l, success: isSuccess(l.finish) }));

  save();
}

// ===== 初期表示 =====
window.onload = () => {
  checkAndResetOnLaunch();
  renderLabels();
  renderLine();
  renderHeatmap();
  renderStreak();

  const allDone = tasks.every(t => status[t.key]);
  if (!allDone) {
    document.body.style.background = "#b2dfdb";
    document.getElementById("statusMsg").innerText = "未完了：今すぐ行動";
  } else {
    document.getElementById("statusMsg").innerText = "完了";
  }
};
